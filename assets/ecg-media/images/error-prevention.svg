<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="10,5" />
  
  <!-- Icon based on type -->
  
    <!-- General ECG Icon -->
    <rect x="300" y="200" width="200" height="200" fill="none" stroke="#ea580c" stroke-width="4"/>
    <path d="M 320 220 L 360 260 L 400 220 L 440 260 L 480 220" 
