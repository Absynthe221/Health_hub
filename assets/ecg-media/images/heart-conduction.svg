<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="10,5" />
  
  <!-- Icon based on type -->
  
    <!-- Heart Anatomy -->
    <ellipse cx="400" cy="250" rx="120" ry="80" fill="#dc2626" opacity="0.3"/>
    <path d="M 280 250 Q 320 200 360 250 Q 400 300 440 250 Q 480 200 520 250" 
          stroke="#dc2626" stroke-width="4" fill="none"/>
    <circle cx="320" cy="220" r="8" fill="#dc2626"/>
    <circle cx="480" cy="220" r="8" fill="#dc2626"/>
  
  
  <!-- Title -->
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#dc2626">
    Cardiac Conduction
  </text>
  
  <!-- Description -->
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">
    Heart anatomy and electrical conduction
  </text>
  
  <!-- Footer -->
  <text x="400" y="580" text-anchor="middle" font-family="Arial" font-size="12" fill="#94a3b8">
    Health Hub ECG Learning Platform - Placeholder Media
  </text>
  
  <!-- Type indicator -->
  <rect x="20" y="560" width="60" height="20" fill="#dc2626" opacity="0.8"/>
  <text x="50" y="574" text-anchor="middle" font-family="Arial" font-size="10" fill="white">
    ANATOMY
  </text>
</svg>