<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="10,5" />
  
  <!-- Icon based on type -->
  
    <!-- Electrode Placement -->
    <circle cx="200" cy="200" r="15" fill="#059669" opacity="0.7"/>
    <circle cx="600" cy="200" r="15" fill="#059669" opacity="0.7"/>
    <circle cx="200" cy="400" r="15" fill="#059669" opacity="0.7"/>
    <circle cx="600" cy="400" r="15" fill="#059669" opacity="0.7"/>
    <circle cx="400" cy="150" r="12" fill="#059669" opacity="0.7"/>
    <circle cx="400" cy="450" r="12" fill="#059669" opacity="0.7"/>
    <text x="400" y="300" text-anchor="middle" font-family="Arial" font-size="16" fill="#059669">Patient</text>
  
  
  <!-- Title -->
  <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#059669">
    Limb Lead Placement
  </text>
  
  <!-- Description -->
  <text x="400" y="130" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">
