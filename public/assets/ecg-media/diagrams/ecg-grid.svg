<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- ECG Grid Background -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
    <pattern id="largeGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#d1d5db" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="200" fill="url(#largeGrid)"/>
  <rect width="800" height="200" fill="url(#smallGrid)"/>
  
  <!-- Baseline -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#374151" stroke-width="2"/>
  
  <!-- Drop Zone Areas (invisible but defined for positioning) -->
  <rect x="100" y="50" width="120" height="60" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  <rect x="220" y="80" width="80" height="40" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  <rect x="300" y="50" width="150" height="80" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  <rect x="450" y="80" width="100" height="40" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  <rect x="550" y="50" width="120" height="60" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
</svg>

